<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAPFLIX handset shell fixture</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#171d22;color:#c0c5c1;font:12px monospace;padding:18px}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible{outline:3px solid #cae19a;outline-offset:4px}.phone{width:min(100%,370px);padding:19px 23px 25px;background:#303d49;border:2px solid #46535d;border-radius:44px 44px 60px 60px;box-shadow:inset 0 0 0 5px #28343e,0 18px 45px #0005}.speaker{width:72px;height:7px;margin:0 auto 16px;background:repeating-linear-gradient(90deg,#10171d 0 3px,#43515c 3px 6px);border-radius:6px}.brand{text-align:center;font-weight:bold;letter-spacing:5px;font-size:15px;margin-bottom:13px;color:#cad0d1}.bezel{padding:12px;border:2px solid #151f27;border-radius:16px;background:#1e2a33}.lcd{position:relative;background:#a6bd70;box-shadow:0 0 16px #a8d36a38,inset 0 0 12px #50632760;padding:7px;border:2px solid #6a7d49;transition:none}.lcd.dim{background:#7c8c62;box-shadow:inset 0 0 12px #33432566}.lcd canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}.softkeys{display:grid;grid-template-columns:1fr 1fr;gap:72px;margin:12px 5px}.key{min-height:44px;border:1px solid #75848c;border-bottom:3px solid #172129;background:#53636d;color:#e1e6e4;border-radius:16px 16px 23px 23px;box-shadow:inset 0 1px 0 #88959b55}.key:active{transform:translateY(2px);border-bottom-width:1px;background:#73808a}.softkeys .key{font-size:15px}.nav{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:9px;align-items:center;margin:3px 19px 15px}.arrows{display:grid;gap:5px}.nav .key{font-size:16px}.ok{height:72px;border-radius:24px;background:#64767f}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px 12px;margin:0 4px}.keypad .key{height:45px;font-size:21px}.keypad small{font-size:8px;margin-left:5px;letter-spacing:1px}.legend{text-align:center;font-size:9px;color:#aab4b9;line-height:1.7;margin:15px 0 0}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}a{color:inherit}.notes{font-size:9px;text-align:center;color:#939e98;margin:14px 0 0}@media(max-width:380px){body{padding:8px}.phone{padding:15px 16px 19px}.keypad{gap:7px}.legend{font-size:8px}}@media(max-height:760px){body{padding:8px}.speaker{margin-bottom:9px}.brand{margin-bottom:8px}.phone{padding-top:13px;padding-bottom:15px}.softkeys{margin:8px 5px}.nav{margin-bottom:9px}.keypad .key{height:39px;min-height:39px}.legend{margin-top:9px}.notes{margin-top:8px}}</style><link rel="stylesheet" href="../../themes.css"></head><body><main><section class="phone" aria-label="WAPFLIX pocket cinema"><div class="speaker" aria-hidden="true"></div><div class="brand">WAPFLIX</div><div class="bezel"><div class="lcd" id="lcd"><canvas id="display" width="240" height="224" aria-hidden="true"></canvas><p id="summary" class="sr" role="status" aria-live="polite">Shell demonstration.</p></div></div><div class="softkeys"><button class="key" id="left" aria-label="OPEN">—</button><button class="key" id="back" aria-label="OPTIONS">—</button></div><div class="nav"><button class="key" data-key="4">◀</button><div class="arrows"><button class="key" data-key="2">▲</button><button class="key" data-key="8">▼</button></div><button class="key ok" data-key="5">OK</button></div><div class="keypad" aria-label="Phone keypad"><button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button><button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button><button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button><button class="key" data-key="*">*</button><button class="key" data-key="0">0</button><button class="key" data-key="#">#</button></div><p class="legend">KEYPAD SHORTCUTS</p></section><p class="notes">Shell preview — not the playback application.</p></main><script>window.events=[];
const demoCanvas=document.getElementById('display'),demoContext=demoCanvas.getContext('2d');
let demoIndex=0;
const demoGlyphs={A:'0E11111F111111',B:'1E11111E11111E',C:'0E11101010110E',D:'1E11111111111E',E:'1F10101E10101F',F:'1F10101E101010',G:'0E11101711110F',H:'1111111F111111',I:'0E04040404040E',J:'0702020212120C',K:'11121418141211',L:'1010101010101F',M:'111B1515111111',N:'11191513111111',O:'0E11111111110E',P:'1E11111E101010',Q:'0E11111115120D',R:'1E11111E141211',S:'0F10100E01011E',T:'1F040404040404',U:'1111111111110E',V:'11111111110A04',W:'11111115151B11',X:'11110A040A1111',Y:'11110A04040404',Z:'1F01020408101F','0':'0E11131519110E','1':'040C040404040E','2':'0E11010204081F','3':'1E01010601011E','4':'02060A121F0202','5':'1F10101E01011E','6':'0E10101E11110E','7':'1F010204080808','8':'0E11110E11110E','9':'0E11110F01010E','/':'01010204081010'};
function pixels(s,x,y){demoContext.fillStyle='#25371e';for(const c of s){const bits=demoGlyphs[c];if(bits)for(let r=0;r<7;r++){const n=parseInt(bits.slice(r*2,r*2+2),16);for(let j=0;j<5;j++)if(n&(16>>j))demoContext.fillRect(x+j,y+r,1,1)}x+=6}}
function drawDemo(){demoContext.clearRect(0,0,240,224);pixels('WAP',27,4);pixels('WAPFLIX',83,4);demoContext.fillStyle='#25371e';for(let i=0;i<4;i++)demoContext.fillRect(2+i*4,12-i*3,3,3+i*3);demoContext.strokeStyle='#25371e';demoContext.strokeRect(214.5,2.5,20,10);demoContext.fillRect(217,5,14,5);demoContext.fillRect(0,19,240,1);pixels('HOME',108,28);['CONTINUE WATCHING','ORIGINAL TRANSMISSIONS','MY LIST','OPTIONS'].forEach((s,i)=>{if(i===demoIndex){demoContext.fillRect(0,50+i*29,240,22);demoContext.save();demoContext.globalCompositeOperation='destination-out';pixels(s,5,57+i*29);demoContext.restore()}else pixels(s,5,57+i*29)});pixels(String(demoIndex+1)+'/4',4,193);demoContext.fillRect(0,207,240,1);pixels('OPEN',3,214);pixels('OPTIONS',195,214)}
function select(){events.push('select')}
function back(){events.push('back')}
function key(k){events.push(k);if(k==='#')document.getElementById('lcd').classList.toggle('dim');if(k==='2')demoIndex=Math.max(0,demoIndex-1);if(k==='8')demoIndex=Math.min(3,demoIndex+1);drawDemo()}
document.getElementById('left').onclick=select;
document.getElementById('back').onclick=()=>events.push('context-right');
document.querySelectorAll('.keypad [data-key]').forEach(b=>b.onclick=()=>key(b.dataset.key));
document.addEventListener('keydown',e=>{if(e.key==='ArrowDown')events.push('document-shortcut')});
window.originalCanvas=demoCanvas;window.originalLeft=document.getElementById('left');window.originalBack=document.getElementById('back');
window.originalKeyHandlers=[...document.querySelectorAll('.keypad button')].map(b=>b.onclick);
drawDemo();</script><script src="../../theme.js"></script></body></html>
