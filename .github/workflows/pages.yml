name: Publish WAPFLIX
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test phone scenes
        run: python -m unittest discover -s tests
      - name: Test LCD player
        run: |
          node tests/test_lcd_player.cjs
          node tests/test_fine_lcd_player.cjs
      - name: Build static cinema
        run: |
          mkdir -p _site/assets
          cp index.html README.md _site/
          touch _site/.nojekyll
          if [ -d assets ]; then cp -R assets/. _site/assets/; fi
          python tools/build.py --output _site/assets
          python tools/catalogue.py --output _site/assets
          python tools/presentation.py --output _site
          python tools/phone_video.py --output _site
          python tools/regenerate_samples.py demos --output _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
