<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a6bd70"><title>WAPFLIX / pocket cinema</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#171d22;color:#c0c5c1;font:12px monospace;padding:18px}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible{outline:3px solid #cae19a;outline-offset:4px}.phone{width:min(100%,370px);padding:19px 23px 25px;background:#303d49;border:2px solid #46535d;border-radius:44px 44px 60px 60px;box-shadow:inset 0 0 0 5px #28343e,0 18px 45px #0005}.speaker{width:72px;height:7px;margin:0 auto 16px;background:repeating-linear-gradient(90deg,#10171d 0 3px,#43515c 3px 6px);border-radius:6px}.brand{text-align:center;font-weight:bold;letter-spacing:5px;font-size:15px;margin-bottom:13px;color:#cad0d1}.bezel{padding:12px;border:2px solid #151f27;border-radius:16px;background:#1e2a33}.lcd{position:relative;background:#a6bd70;box-shadow:0 0 16px #a8d36a38,inset 0 0 12px #50632760;padding:7px;border:2px solid #6a7d49;transition:none}.lcd.dim{background:#7c8c62;box-shadow:inset 0 0 12px #33432566}.lcd canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}.softkeys{display:grid;grid-template-columns:1fr 1fr;gap:72px;margin:12px 5px}.key{min-height:44px;border:1px solid #75848c;border-bottom:3px solid #172129;background:#53636d;color:#e1e6e4;border-radius:16px 16px 23px 23px;box-shadow:inset 0 1px 0 #88959b55}.key:active{transform:translateY(2px);border-bottom-width:1px;background:#73808a}.softkeys .key{font-size:15px}.nav{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:9px;align-items:center;margin:3px 19px 15px}.arrows{display:grid;gap:5px}.nav .key{font-size:16px}.ok{height:72px;border-radius:24px;background:#64767f}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px 12px;margin:0 4px}.keypad .key{height:45px;font-size:21px}.keypad small{font-size:8px;margin-left:5px;letter-spacing:1px}.legend{text-align:center;font-size:9px;color:#aab4b9;line-height:1.7;margin:15px 0 0}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}a{color:inherit}.notes{font-size:9px;text-align:center;color:#939e98;margin:14px 0 0}@media(max-width:380px){body{padding:8px}.phone{padding:15px 16px 19px}.keypad{gap:7px}.legend{font-size:8px}}@media(max-height:760px){body{padding:8px}.speaker{margin-bottom:9px}.brand{margin-bottom:8px}.phone{padding-top:13px;padding-bottom:15px}.softkeys{margin:8px 5px}.nav{margin-bottom:9px}.keypad .key{height:39px;min-height:39px}.legend{margin-top:9px}.notes{margin-top:8px}}
</style></head><body>
<main><section class="phone" aria-label="WAPFLIX green-backlit pocket cinema"><div class="speaker" aria-hidden="true"></div><div class="brand">WAPFLIX</div><div class="bezel"><div class="lcd" id="lcd"><canvas id="display" width="240" height="224" aria-hidden="true"></canvas><p id="summary" class="sr" role="status" aria-live="polite">Connecting to pocket cinema.</p></div></div>
<div class="softkeys"><button class="key" id="left" aria-label="Select">—</button><button class="key" id="back" aria-label="Back">—</button></div><div class="nav"><button class="key" data-key="4" aria-label="Previous item or rewind five seconds">◀</button><div class="arrows"><button class="key" data-key="2" aria-label="Move up">▲</button><button class="key" data-key="8" aria-label="Move down">▼</button></div><button class="key ok" data-key="5" aria-label="Select or play and pause">OK</button></div>
<div class="keypad" aria-label="Phone keypad"><button class="key" data-key="1">1<small>INFO</small></button><button class="key" data-key="2">2<small>ABC</small></button><button class="key" data-key="3">3<small>DEF</small></button><button class="key" data-key="4">4<small>GHI</small></button><button class="key" data-key="5">5<small>JKL</small></button><button class="key" data-key="6">6<small>MNO</small></button><button class="key" data-key="7">7<small>PQRS</small></button><button class="key" data-key="8">8<small>TUV</small></button><button class="key" data-key="9">9<small>WXYZ</small></button><button class="key" data-key="*" aria-label="Return to catalogue">*</button><button class="key" data-key="0" aria-label="Change connection quality">0<small>QUALITY</small></button><button class="key" data-key="#" aria-label="Toggle backlight" aria-pressed="true">#</button></div><p class="legend">2/8 SCROLL · 5 SELECT · 4/6 SEEK<br>0 QUALITY · * MENU · # BACKLIGHT</p></section><p class="notes">A fictional handset. Real text transmissions.</p></main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('display'),ctx=canvas.getContext('2d'),ink='#25371e';
// Original 5x7 glyphs. Rows are five-bit masks; no downloaded font or antialiasing.
const glyphs={A:'0E11111F111111',B:'1E11111E11111E',C:'0E11101010110E',D:'1E11111111111E',E:'1F10101E10101F',F:'1F10101E101010',G:'0E11101711110F',H:'1111111F111111',I:'0E04040404040E',J:'0702020212120C',K:'11121418141211',L:'1010101010101F',M:'111B1515111111',N:'11191513111111',O:'0E11111111110E',P:'1E11111E101010',Q:'0E11111115120D',R:'1E11111E141211',S:'0F10100E01011E',T:'1F040404040404',U:'1111111111110E',V:'11111111110A04',W:'11111115151B11',X:'11110A040A1111',Y:'11110A04040404',Z:'1F01020408101F','0':'0E11131519110E','1':'040C040404040E','2':'0E11010204081F','3':'1E01010601011E','4':'02060A121F0202','5':'1F10101E01011E','6':'0E10101E11110E','7':'1F010204080808','8':'0E11110E11110E','9':'0E11110F01010E','.':'00000000000C0C',',':'000000000C0C08',':':'000C0C000C0C00',';':'000C0C000C0C08','!':'04040404040004','?':'0E110102040004','-':'0000001F000000','_':'0000000000001F','/':'01010204081010','\\':'10100804020101','|':'04040404040404','[':'0E08080808080E',']':'0E02020202020E','(':'02040808080402',')':'08040202020408','<':'01020408040201','>':'10080402040810','+':'0004041F040400','=':'00001F001F0000','*':'00150E1F0E1500','#':'0A1F0A0A1F0A00',"'":'04040800000000','"':'0A0A1400000000','@':'0E11171517100F','&':'0C12140C15120D','%':'19190204081313','~':'00000916000000','^':'040A1100000000'};
function text(value,x,y,target=ctx){target.fillStyle=ink;for(const char of String(value).toUpperCase()){const bits=glyphs[char];if(bits)for(let row=0;row<7;row++){const mask=parseInt(bits.slice(row*2,row*2+2),16);for(let col=0;col<5;col++)if(mask&(16>>col))target.fillRect(x+col,y+row,1,1);}x+=6;}}
function center(s,y){text(s,Math.max(2,Math.floor((240-s.length*6)/2)),y);}
function wrap(s,width=37){const lines=[];let line='';for(const word of String(s).split(/\s+/)){if((line+' '+word).trim().length>width&&line){lines.push(line);line='';}line+=(line?' ':'')+word;}if(line)lines.push(line);return lines;}
let groups=[],group=0,index=0,view='library',previous='library',item=null,clip=null,elapsed=0,playing=false,last=0,frame=-1,token=0,lit=true,quality=0,bytes=0,message='',detail=false;
const cache=new Map(),qualities=['low','medium','high'],labels=['14.4K','28.8K','56K'];
const image=document.createElement('canvas'),imageCtx=image.getContext('2d');
const seconds=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function announce(s){$('summary').textContent=s;}
function header(){ctx.clearRect(0,0,240,224);ctx.fillStyle=ink;for(let i=0;i<4;i++)ctx.fillRect(2+i*4,12-i*3,3,3+i*3);text('WAPFLIX',83,3);text('WAP',29,3);ctx.strokeStyle=ink;ctx.lineWidth=1;ctx.strokeRect(214.5,2.5,20,10);ctx.fillRect(235,5,2,5);ctx.fillRect(217,5,14,5);ctx.fillRect(0,19,240,1);}
function footer(left,right){ctx.fillStyle=ink;ctx.fillRect(0,207,240,1);text(left,3,214);text(right,237-right.length*6,214);$('left').setAttribute('aria-label',left);$('back').setAttribute('aria-label',right);}
function row(label,n,selected){if(selected){ctx.fillStyle=ink;ctx.fillRect(0,47+n*23,240,21);ctx.save();ctx.globalCompositeOperation='destination-out';text(label.slice(0,38),5,54+n*23);ctx.restore();}else text(label.slice(0,38),5,54+n*23);}
function render(){header();if(view==='library'||view==='episodes'){const entries=view==='library'?groups:groups[group].items;center(view==='library'?'POCKET CINEMA':groups[group].name.slice(0,38),28);const current=view==='library'?group:index,start=Math.floor(current/6)*6;entries.slice(start,start+6).forEach((entry,n)=>row(view==='library'?entry.name:(entry.fictional?`E${String(entry.episode).padStart(2,'0')} `:'')+(entry.episode?entry.title.split(': ').slice(1).join(': ')||entry.title:entry.title),n,current===start+n));text(`${current+1}/${entries.length}`,3,193);text('0 '+labels[quality],166,193);footer('SELECT',view==='library'?'ABOUT':'BACK');}
else if(view==='about'){center('CINEMA / REDUCED',31);['A GREEN SCREEN.','A FEW CHARACTERS.','LARGE FEELINGS.','','MODEM LABELS ARE FICTIONAL.','CLIPS BUFFER BEFORE PLAYING.','NO SOUND. NO REAL TV FOOTAGE.','','2/8 SCROLL   5 SELECT','4/6 SEEK     0 QUALITY','* MENU       # LIGHT'].forEach((s,n)=>text(s,5,49+n*12));footer('BACK','BACK');}
else{center(item?item.title.slice(0,38):'TRANSMISSION',27);if(message){wrap(message,34).slice(0,8).forEach((s,n)=>center(s,75+n*13));}else if(clip){ctx.imageSmoothingEnabled=false;const scale=Math.min(232/image.width,108/image.height);ctx.drawImage(image,Math.floor((240-image.width*scale)/2),45,image.width*scale,image.height*scale);const sub=(clip.subtitles||[]).find(s=>elapsed>=s.start&&elapsed<s.end);wrap(sub?sub.text:'',37).slice(0,3).forEach((s,n)=>center(s,158+n*10));text(`${seconds(elapsed)}/${seconds(clip.frames.length/clip.fps)}`,3,193);text(`${labels[quality]} ${(bytes/1024).toFixed(1)}K`,151,193);if(detail){ctx.fillStyle=lit?'#a6bd70':'#7c8c62';ctx.fillRect(0,42,240,145);wrap(item.description,36).slice(0,9).forEach((s,n)=>text(s,5,46+n*13));}}footer(message==='RECEIVING CHARACTERS...'?'WAIT':playing?'PAUSE':'PLAY','BACK');}}
function paint(){if(!clip)return;const n=Math.min(clip.frames.length-1,Math.floor(elapsed*clip.fps));if(n!==frame){frame=n;imageCtx.clearRect(0,0,image.width,image.height);clip.frames[n].split('\n').forEach((line,row)=>text(line,0,row*8,imageCtx));}render();}
function setPlaying(on){playing=on;last=0;}
async function load(selected,keep=false){const id=++token,old=elapsed;item=selected;view='player';detail=false;setPlaying(false);clip=null;frame=-1;message='RECEIVING CHARACTERS...';render();announce(message);try{const variant=item.variants[qualities[quality]];let entry=cache.get(variant.path);if(!entry){const compressed='DecompressionStream' in window,r=await fetch(compressed?variant.path:variant.fallback);if(!r.ok)throw Error(`HTTP ${r.status}`);const blob=await r.blob(),data=compressed?await new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).json():JSON.parse(await blob.text());entry={data,bytes:blob.size};cache.set(variant.path,entry);}if(id!==token)return;clip=entry.data;bytes=entry.bytes;elapsed=keep?Math.min(old,clip.frames.length/clip.fps-.001):0;image.width=clip.cols*6;image.height=clip.rows*8;message='';paint();announce(item.title+'. Ready. Press select to play. '+item.description);}catch(e){if(id!==token)return;message='SIGNAL LOST. '+e.message+'. BACK TO RETRY.';render();announce(message);}}
function select(){if(!groups.length)return;if(view==='library'){index=0;view='episodes';}else if(view==='episodes'){load(groups[group].items[index]);return;}else if(view==='about'){view=previous;}else if(clip){if(elapsed>=clip.frames.length/clip.fps)elapsed=0;setPlaying(!playing);paint();announce(playing?'Playing.':'Paused.');return;}render();announce(view==='episodes'?groups[group].name:groups[group]?.name||'Pocket cinema');}
function back(){if(!groups.length)return;if(view==='player'){++token;setPlaying(false);view='episodes';clip=null;message='';}else if(view==='episodes'){view='library';}else if(view==='about'){view=previous;}else{previous=view;view='about';}render();announce(view==='library'?'Pocket cinema. '+groups[group]?.name:view==='episodes'?groups[group].name:'About pocket cinema.');}
function key(k){if(k==='#'){lit=!lit;$('lcd').classList.toggle('dim',!lit);document.querySelector('[data-key="#"]').setAttribute('aria-pressed',String(lit));render();return;}if(k==='*'){if(!groups.length)return;++token;setPlaying(false);clip=null;view='library';render();announce('Pocket cinema. '+groups[group]?.name);return;}if(!groups.length)return;if(k==='0'){quality=(quality+1)%3;if(view==='player'&&item)load(item,true);else render();announce('Connection class '+labels[quality]);return;}if(k==='5'){select();return;}if(view==='player'){if((k==='4'||k==='6')&&clip){elapsed=Math.max(0,Math.min(clip.frames.length/clip.fps,elapsed+(k==='4'?-5:5)));paint();}if(k==='1'){detail=!detail;render();announce(detail?item.description:'Player.');}return;}if(['2','8','4','6'].includes(k)&&view!=='about'){const delta=k==='2'||k==='4'?-1:1;if(view==='library')group=(group+delta+groups.length)%groups.length;else index=(index+delta+groups[group].items.length)%groups[group].items.length;render();announce(view==='library'?groups[group].name:groups[group].items[index].title);}}
$('left').onclick=()=>{if(view==='about')back();else select();};$('back').onclick=back;document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>key(b.dataset.key));
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key===' '&&e.target.tagName==='BUTTON')return;const map={ArrowUp:'2',ArrowDown:'8',ArrowLeft:'4',ArrowRight:'6',' ':'5'};if(e.key==='Escape'){e.preventDefault();back();return;}if(e.key==='Enter'){if(e.target.tagName!=='BUTTON'){e.preventDefault();select();}return;}const k=map[e.key]||e.key;if('1234567890*#'.includes(k)&&k.length===1){e.preventDefault();key(k);}});
document.addEventListener('visibilitychange',()=>{last=0;});
function tick(t){if(playing&&clip){if(last)elapsed+=(t-last)/1000;last=t;if(elapsed>=clip.frames.length/clip.fps){elapsed=clip.frames.length/clip.fps;setPlaying(false);}if(Math.floor(elapsed*clip.fps)!==frame)paint();}requestAnimationFrame(tick);}requestAnimationFrame(tick);
async function init(){header();center('CONNECTING...',90);footer('WAIT','WAIT');try{const r=await fetch('assets/catalogue.json');if(!r.ok)throw Error(`HTTP ${r.status}`);const entries=await r.json(),map=new Map();for(const entry of entries){const name=entry.series?`${entry.series} S${entry.season}`:'ORIGINAL TRANSMISSIONS';if(!map.has(name))map.set(name,{name,items:[]});map.get(name).items.push(entry);}groups=[...map.values()];if(!groups.length)throw Error('Empty catalogue');render();announce('Pocket cinema. '+groups[0].name+'. Use up and down, then select.');}catch(e){view='player';message='NO SIGNAL. '+e.message+'. RELOAD TO RETRY.';render();announce(message);}}init();
</script></body></html>
